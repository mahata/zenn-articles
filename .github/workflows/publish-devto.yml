name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "articles-en/**"
      - "!articles-en/devto-articles.json"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only show the planned changes without creating or updating dev.to articles
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ inputs.dry-run && 'devto-dry-run' || 'devto-publish' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Sync articles-en with dev.to
        run: node scripts/devto/main.ts ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Commit dev.to article IDs
        if: ${{ !cancelled() && !inputs.dry-run }}
        run: |
          git add articles-en/devto-articles.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update dev.to article IDs"
          git pull --rebase origin main
          git push origin HEAD:main
